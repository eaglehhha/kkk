name: Auto Update Worker

on:
  # push:
  #   branches:
  #     - main
  # schedule:
  #   - cron: "0 1 * * *" # 每天凌晨1点运行（已注释停止自动更新）
  workflow_dispatch:
    inputs:
      force_update:
        description: '是否强制更新（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置环境
        run: |
          echo "REPO_URL=https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases" >> $GITHUB_ENV

      - name: 检查并更新 Worker
        id: check_update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 使用 GitHub Token 认证
        run: |
          # 日志函数
          log() { echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"; }

          log "开始检查更新..."

          # 获取本地版本
          LOCAL_VERSION=$(cat version.txt 2>/dev/null || echo "")
          log "本地版本: ${LOCAL_VERSION:-无}"

          # 获取最新 Release
          log "获取最新 Release 信息..."
          RESPONSE=$(curl -s --retry 3 -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" "$REPO_URL")
          if [ $? -ne 0 ]; then
            log "ERROR: 无法访问 GitHub API"
            exit 1
          fi

          TAG_NAME=$(echo "$RESPONSE" | jq -r '.[0].tag_name')
          
          # 尝试同时获取 zip 和 js 文件的下载链接
          ZIP_URL=$(echo "$RESPONSE" | jq -r '.[0].assets[] | select(.name == "worker.zip") | .browser_download_url')
          JS_URL=$(echo "$RESPONSE" | jq -r '.[0].assets[] | select(.name == "worker.js") | .browser_download_url')

          # 优先级调整：优先锁定 zip 文件
          if [ -n "$ZIP_URL" ] && [ "$ZIP_URL" != "null" ]; then
            DOWNLOAD_URL="$ZIP_URL"
            FILE_EXT="zip"
            log "检测到上游发布了 worker.zip，优先使用"
          elif [ -n "$JS_URL" ] && [ "$JS_URL" != "null" ]; then
            DOWNLOAD_URL="$JS_URL"
            FILE_EXT="js"
            log "未找到 worker.zip，回退使用独立的 worker.js"
          else
            log "ERROR: 未找到 worker.zip 或 worker.js"
            exit 1
          fi

          log "最新版本: $TAG_NAME"
          
          # 记录版本号供后续步骤使用
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          # 判断是否需要更新
          FORCE_UPDATE=${{ github.event.inputs.force_update || 'false' }}
          if [ "$LOCAL_VERSION" = "$TAG_NAME" ] && [ "$FORCE_UPDATE" != "true" ]; then
            log "已是最新版本，无需更新"
            exit 0
          fi

          # 根据文件类型执行不同的更新逻辑
          if [ "$FILE_EXT" = "zip" ]; then
            log "下载 worker.zip..."
            wget -q -O "worker.zip" "$DOWNLOAD_URL"
            
            log "解压 worker.zip..."
            unzip -o "worker.zip"
            
            # 如果解压出来的是 worker.js（无下划线），则重命名适配 Cloudflare Pages
            if [ -f "worker.js" ]; then
              mv worker.js _worker.js
            fi
            
            rm "worker.zip"
          else
            log "下载 worker.js 并直接保存为 _worker.js..."
            wget -q -O "_worker.js" "$DOWNLOAD_URL"
          fi
          
          echo "$TAG_NAME" > version.txt
          log "更新完成，新版本: $TAG_NAME"

      - name: 提交更改
        if: success() # 仅在更新成功时提交
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动同步 Worker 版本: ${{ steps.check_update.outputs.tag_name || '未知' }}"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
